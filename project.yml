name: FloatingTerminal
options:
  bundleIdPrefix: com.tsitser.dev
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.tsitser.dev.FloatingTerminal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.20.0
targets:
  FloatingTerminal:
    type: application
    platform: macOS
    sources:
      - path: FloatingTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsitser.dev.FloatingTerminal
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FloatingTerminal/Info.plist
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - package: SwiftTerm
  FloatingTerminalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FloatingTerminalTests
    dependencies:
      - target: FloatingTerminal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
